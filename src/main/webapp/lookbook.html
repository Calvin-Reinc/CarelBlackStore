<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flying Jvck - Lookbook</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Monospace web font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        @font-face {
            font-family: "Super Squad";
            src: url("assets/fonts/SuperSquad.woff2") format("woff2"),
                 url("assets/fonts/SuperSquad.ttf") format("truetype"),
                 url("assets/fonts/SuperSquad.otf") format("opentype");
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --cb-black: #111111;
            --cb-white: #ffffff;
            --cb-muted: #6c757d;
            --cb-border: #e5e7eb;
            --cb-spectrum: linear-gradient(
                90deg,
                #ff2a6d 0%,
                #ff7b00 18%,
                #ffd400 36%,
                #00c853 54%,
                #00b0ff 72%,
                #7c4dff 88%,
                #ff2a6d 100%
            );
        }

        html, body {
            background-color: var(--cb-white);
            color: var(--cb-black);
            font-family: "Space Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            margin: 0;
            padding: 0;
        }

        .spectrum-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--cb-spectrum);
            z-index: 1030;
        }

        .page-shell {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* Top Logo & Clock */
        .lookbook-header {
            padding-top: 1.5rem;
            padding-bottom: 0.5rem;
        }

        .header-logo {
            width: clamp(64px, 10vw, 88px);
            height: auto;
            display: block;
            margin-inline: auto;
            transition: transform 0.25s ease;
        }

        .logo-link:hover .header-logo {
            transform: scale(1.04);
        }

        .live-clock {
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            color: var(--cb-muted);
            text-transform: uppercase;
        }

        /* Featured Product in Focus (Left) */
        .focus-link {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 4 / 5;
            max-height: 620px;
            background-color: #f8f9fa;
            border: 1px solid var(--cb-border);
            overflow: hidden;
            text-decoration: none;
        }

        .focus-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.45s ease;
        }

        .focus-link:hover .focus-img {
            transform: scale(1.02);
        }

        .focus-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
        }

        /* Right Gallery Thumbnail Grid */
        .thumb-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 0.45rem;
        }

        @media (max-width: 575.98px) {
            .thumb-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        .thumb-btn {
            padding: 0;
            border: 1px solid var(--cb-border);
            background-color: #f8f9fa;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            cursor: pointer;
            display: block;
            width: 100%;
            transition: border-color 0.2s ease;
        }

        .thumb-btn:hover {
            border-color: #6c757d;
        }

        .thumb-btn.active {
            border: 2px solid #ff2a6d;
            box-shadow: 0 0 0 1px var(--cb-black);
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .thumb-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
            font-size: 0.9rem;
        }

        /* Lookbook Counter & Prev/Next Arrows */
        .pager-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.75rem;
            font-size: 0.78rem;
            letter-spacing: 0.06em;
        }

        .pager-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--cb-black);
            padding: 0.2rem 0.45rem;
            cursor: pointer;
            line-height: 1;
        }

        .pager-btn:hover:not(:disabled) {
            border-color: var(--cb-black);
        }

        .pager-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Bottom Metadata & Category Dropup Bar */
        .lookbook-bottom-bar {
            border-top: 1px solid var(--cb-border);
            padding-top: 1rem;
        }

        .brand-badge {
            display: inline-block;
            background-color: var(--cb-black);
            color: var(--cb-white);
            font-family: "Super Squad", Impact, "Arial Black", sans-serif;
            font-size: 1.25rem;
            letter-spacing: 0.04em;
            padding: 0.25rem 0.85rem;
            text-decoration: none;
        }

        .brand-badge:hover {
            color: var(--cb-white);
            background-image: var(--cb-spectrum);
        }

        /* Bottom Category Selector */
        .cat-trigger {
            position: relative;
            background: #ffffff;
            border: 1px solid var(--cb-black);
            border-radius: 0;
            color: var(--cb-black);
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.45rem 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .cat-trigger:hover,
        .cat-trigger[aria-expanded="true"] {
            background-color: var(--cb-black);
            color: var(--cb-white);
        }

        .cat-menu {
            border-radius: 0 !important;
            border: 1px solid var(--cb-black);
            padding: 0.25rem 0;
            min-width: 210px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
        }

        .cat-menu .dropdown-item {
            font-size: 0.76rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 0.5rem 0.9rem;
            color: var(--cb-black);
        }

        .cat-menu .dropdown-item:hover {
            background-color: #f8f9fa;
        }

        .cat-menu .dropdown-item.active {
            background-color: var(--cb-black);
            color: var(--cb-white);
            font-weight: 700;
        }

        .footer-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            border-top: 1px solid #f1f3f5;
            padding: 1rem 0 1.5rem;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .footer-nav-link {
            color: var(--cb-muted);
            text-decoration: none;
        }

        .footer-nav-link:hover {
            color: var(--cb-black);
        }

        .footer-nav-link.active {
            color: var(--cb-black);
            font-weight: 700;
        }
    </style>
</head>
<body class="bg-white">

    <div class="spectrum-bar" aria-hidden="true"></div>

    <div class="page-shell container-lg px-3 px-md-4">

        <!-- Top Logo -> Store Home (index.html) + Live PTA Clock -->
        <header class="lookbook-header text-center">
            <a href="index.html" class="logo-link d-inline-block mb-2" aria-label="flying Jvck Home">
                <img src="assets/img/Artwork.png"
                     onerror="if (!this.dataset.fallback) { this.dataset.fallback = '1'; this.src = 'assets/img/logo.png'; }"
                     alt="flying Jvck Logo"
                     class="header-logo img-fluid">
            </a>
            <p id="ptaClock" class="live-clock mb-0">PTA // --/--/---- --:--</p>
        </header>

        <!-- Main Lookbook Content -->
        <main class="flex-grow-1 d-flex flex-column justify-content-between py-3 py-md-4">

            <div>
                <!-- Loading State -->
                <div id="loadingState" class="text-center py-5">
                    <div class="spinner-border spinner-border-sm text-dark" role="status">
                        <span class="visually-hidden">Loading lookbook...</span>
                    </div>
                    <p class="small text-muted mt-2 mb-0">Loading lookbook...</p>
                </div>

                <!-- Empty / Error State -->
                <div id="emptyState" class="text-center py-5 border d-none">
                    <i class="bi bi-images fs-2 text-muted d-block mb-2"></i>
                    <p class="small text-muted mb-0" id="emptyStateText">No pieces found in this category yet.</p>
                </div>

                <!-- Supreme-Style Focus Image + Thumbnail Gallery Grid -->
                <div id="lookbookStage" class="d-none">
                    <div class="row g-4 align-items-start justify-content-center mb-4">

                        <!-- Left: Product in Focus (click intuitively opens Previews) -->
                        <div class="col-12 col-md-7 col-lg-6">
                            <a id="focusLink" href="previews.html" class="focus-link" aria-label="View item">
                                <img id="focusImg" src="" alt="Product in focus" class="focus-img d-none">
                                <div id="focusPlaceholder" class="focus-placeholder d-none">
                                    <i class="bi bi-image fs-1 mb-2"></i>
                                    <span class="small">No image available</span>
                                </div>
                            </a>
                        </div>

                        <!-- Right: Category Gallery Thumbnail Grid -->
                        <div class="col-12 col-md-5 col-lg-5">
                            <div id="thumbGrid" class="thumb-grid mb-3"></div>

                            <div class="pager-row">
                                <button type="button" id="prevBtn" class="pager-btn" aria-label="Previous piece">&larr;</button>
                                <span id="pagerCounter">1 of 1</span>
                                <button type="button" id="nextBtn" class="pager-btn" aria-label="Next piece">&rarr;</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Bottom Row: Brand Badge + Item Name/Description (no price/category) + Current Category Dropup -->
            <div class="lookbook-bottom-bar row g-3 align-items-center mt-2">
                <div class="col-auto">
                    <a href="index.html" class="brand-badge">flying Jvck</a>
                </div>

                <div class="col" id="metaProductInfo">
                    <div class="fw-bold small" id="metaProductName"></div>
                    <div class="small text-muted" id="metaProductDesc"></div>
                </div>

                <div class="col-12 col-sm-auto ms-sm-auto">
                    <div class="dropup" id="categoryDropup">
                        <button type="button"
                                id="currentCategoryBtn"
                                class="cat-trigger"
                                data-bs-toggle="dropdown"
                                aria-expanded="false">
                            <span id="currentCategoryLabel">Category</span>
                            <i class="bi bi-chevron-up" style="font-size: 0.7rem;"></i>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end cat-menu" id="categoryDropdownList">
                            <!-- Populated dynamically -->
                        </ul>
                    </div>
                </div>
            </div>

        </main>

        <!-- Clean Minimal Footer Navigation -->
        <footer class="footer-nav">
            <div>
                <a href="store.html" class="footer-nav-link">shop</a>
            </div>
            <div class="d-flex flex-wrap gap-3 gap-md-4">
                <a href="previews.html" class="footer-nav-link">previews</a>
                <a href="lookbook.html" class="footer-nav-link active">lookbook</a>
                <a href="blog.html" class="footer-nav-link">blog</a>
            </div>
        </footer>

    </div>

    <!-- Bootstrap JS Bundle (for Category Dropup) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

    <script>
        let categories = [];
        let activeCategoryId = null;
        let currentProducts = [];
        let currentIndex = 0;

        // Live Pretoria Clock (no seconds)
        function updatePtaClock() {
            const now = new Date();
            const datePart = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Africa/Johannesburg',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            }).format(now);

            const timePart = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Africa/Johannesburg',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            }).format(now);

            document.getElementById('ptaClock').textContent = `PTA // ${datePart} ${timePart} SAST`;
        }

        updatePtaClock();
        setInterval(updatePtaClock, 5000);

        document.addEventListener('DOMContentLoaded', initLookbook);

        async function initLookbook() {
            try {
                const res = await fetch('api/categories');
                if (!res.ok) {
                    document.getElementById('categoryDropup').classList.add('d-none');
                    showEmptyState('Unable to load categories right now.');
                    return;
                }

                const rawCategories = await res.json();
                if (!Array.isArray(rawCategories) || rawCategories.length === 0) {
                    document.getElementById('categoryDropup').classList.add('d-none');
                    showEmptyState('No categories have been added yet.');
                    return;
                }

                // Sort newest first (highest category_id = latest category)
                categories = [...rawCategories].sort((a, b) => (b.category_id ?? 0) - (a.category_id ?? 0));

                const urlCatId = Number(new URLSearchParams(window.location.search).get('category_id'));
                const matched = categories.find(c => (c.category_id ?? 0) === urlCatId);
                activeCategoryId = matched ? (matched.category_id ?? 0) : (categories[0].category_id ?? 0);

                renderCategoryDropup();
                await selectCategory(activeCategoryId, false);
            } catch (err) {
                console.error('Lookbook init error:', err);
                showEmptyState('Network error loading lookbook.');
            }
        }

        function renderCategoryDropup() {
            const list = document.getElementById('categoryDropdownList');
            const label = document.getElementById('currentCategoryLabel');
            list.innerHTML = '';

            const currentObj = categories.find(c => (c.category_id ?? 0) === activeCategoryId);
            label.textContent = currentObj ? (currentObj.category_name ?? `Category #${activeCategoryId}`) : 'Category';

            categories.forEach(c => {
                const cid = c.category_id ?? 0;
                const cname = c.category_name ?? `Category #${cid}`;

                const li = document.createElement('li');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'dropdown-item' + (cid === activeCategoryId ? ' active' : '');
                btn.textContent = cname;
                btn.addEventListener('click', () => selectCategory(cid, true));
                li.appendChild(btn);
                list.appendChild(li);
            });
        }

        async function selectCategory(categoryId, updateUrl = true) {
            activeCategoryId = categoryId;
            renderCategoryDropup();

            if (updateUrl) {
                const url = new URL(window.location);
                url.searchParams.set('category_id', String(categoryId));
                window.history.replaceState({}, '', url);
            }

            document.getElementById('loadingState').classList.remove('d-none');
            document.getElementById('emptyState').classList.add('d-none');
            document.getElementById('lookbookStage').classList.add('d-none');
            document.getElementById('metaProductName').textContent = '';
            document.getElementById('metaProductDesc').textContent = '';

            try {
                const res = await fetch(`api/products?category_id=${encodeURIComponent(categoryId)}&limit=100`);
                if (!res.ok) {
                    showEmptyState('Unable to load products for this category.');
                    return;
                }

                const products = await res.json();
                currentProducts = Array.isArray(products) ? products : [];
                currentIndex = 0;

                if (currentProducts.length === 0) {
                    showEmptyState('No pieces in this category yet.');
                    return;
                }

                renderLookbookStage();
            } catch (err) {
                console.error('Error loading category products:', err);
                showEmptyState('Network error loading products.');
            }
        }

        function renderLookbookStage() {
            const grid = document.getElementById('thumbGrid');
            grid.innerHTML = '';

            currentProducts.forEach((p, idx) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'thumb-btn' + (idx === currentIndex ? ' active' : '');
                btn.setAttribute('aria-label', p.product_name ?? `Item ${idx + 1}`);

                if (p.image_url) {
                    const img = document.createElement('img');
                    img.src = p.image_url;
                    img.alt = p.product_name ?? '';
                    img.className = 'thumb-img';
                    btn.appendChild(img);
                } else {
                    const ph = document.createElement('div');
                    ph.className = 'thumb-placeholder';
                    ph.innerHTML = '<i class="bi bi-image"></i>';
                    btn.appendChild(ph);
                }

                btn.addEventListener('click', () => setFocusIndex(idx));
                grid.appendChild(btn);
            });

            document.getElementById('loadingState').classList.add('d-none');
            document.getElementById('emptyState').classList.add('d-none');
            document.getElementById('lookbookStage').classList.remove('d-none');

            updateFocusDisplay();
        }

        function setFocusIndex(index) {
            if (index < 0 || index >= currentProducts.length) return;
            currentIndex = index;

            const thumbBtns = document.querySelectorAll('#thumbGrid .thumb-btn');
            thumbBtns.forEach((btn, idx) => btn.classList.toggle('active', idx === currentIndex));

            updateFocusDisplay();
        }

        function updateFocusDisplay() {
            const p = currentProducts[currentIndex];
            if (!p) return;

            const pid = p.product_id ?? 0;
            const name = p.product_name ?? 'Untitled Piece';
            const desc = (p.description && p.description.trim()) ? p.description.trim() : '';
            const imageUrl = p.image_url ?? '';

            document.getElementById('focusLink').href = `previews.html?id=${encodeURIComponent(pid)}`;

            const focusImg = document.getElementById('focusImg');
            const focusPlaceholder = document.getElementById('focusPlaceholder');

            if (imageUrl) {
                focusImg.src = imageUrl;
                focusImg.alt = name;
                focusImg.classList.remove('d-none');
                focusPlaceholder.classList.add('d-none');
            } else {
                focusImg.src = '';
                focusImg.classList.add('d-none');
                focusPlaceholder.classList.remove('d-none');
            }

            document.getElementById('metaProductName').textContent = name;
            document.getElementById('metaProductDesc').textContent = desc;

            const total = currentProducts.length;
            document.getElementById('pagerCounter').textContent = `${currentIndex + 1} of ${total}`;
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            document.getElementById('nextBtn').disabled = currentIndex >= total - 1;
        }

        function showEmptyState(message) {
            document.getElementById('loadingState').classList.add('d-none');
            document.getElementById('lookbookStage').classList.add('d-none');
            document.getElementById('emptyStateText').textContent = message;
            document.getElementById('emptyState').classList.remove('d-none');
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (currentIndex > 0) setFocusIndex(currentIndex - 1);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (currentIndex < currentProducts.length - 1) setFocusIndex(currentIndex + 1);
        });

        // Keyboard left/right navigation through lookbook items
        document.addEventListener('keydown', (e) => {
            if (currentProducts.length === 0) return;
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                setFocusIndex(currentIndex - 1);
            } else if (e.key === 'ArrowRight' && currentIndex < currentProducts.length - 1) {
                setFocusIndex(currentIndex + 1);
            }
        });
    </script>

</body>
</html>
