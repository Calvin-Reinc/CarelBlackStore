<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carel Black</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

    <!-- Google Fonts: Exile -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exile&display=swap" rel="stylesheet">

    <style>
        html, body {
            background-color: #ffffff;
            color: #111111;
            margin: 0;
        }

        .hero-wrapper {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .brand-logo {
            width: clamp(120px, 24vw, 190px);
            height: auto;
            background-color: transparent;
            display: block;
            margin-inline: auto;
        }

        .brand-title {
            font-family: "Exile", system-ui, -apple-system, sans-serif;
            font-size: clamp(2.5rem, 10vw, 6.5rem);
            line-height: 1.05;
            letter-spacing: 0.02em;
            color: #111111;
            word-break: break-word;
        }

        .btn-stack {
            width: 100%;
            max-width: 260px;
        }

        .action-btn {
            width: 100%;
            min-height: 48px;
            padding: 0.75rem 1.75rem;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            border-radius: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Active button: solid black at rest -> smooth gray & black gradient on hover */
        .btn-dashboard {
            color: #ffffff;
            border: 1px solid #111111;
            background-color: #111111;
            background-image: linear-gradient(135deg, #111111 0%, #111111 44%, #6c757d 72%, #000000 100%);
            background-size: 260% 260%;
            background-position: 0% 50%;
            transition: background-position 0.35s ease, border-color 0.3s ease, transform 0.2s ease, box-shadow 0.25s ease;
        }

        .btn-dashboard:hover,
        .btn-dashboard:focus-visible {
            color: #ffffff;
            border-color: #343a40;
            background-position: 100% 50%;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.16);
        }

        .btn-dashboard:active {
            transform: translateY(0);
            color: #ffffff;
        }

        /* Unclickable Store button */
        .store-btn-wrap {
            width: 100%;
            cursor: not-allowed;
        }

        .btn-store-disabled,
        .btn-store-disabled:disabled {
            color: #111111;
            background-color: transparent;
            border: 1px solid #111111;
            opacity: 0.4;
            pointer-events: none;
        }

        /* Tablet & larger spacing */
        @media (min-width: 768px) {
            .btn-stack {
                max-width: 240px;
            }
        }

        /* Short landscape viewports (e.g., rotated phones or small laptops) */
        @media (max-height: 600px) {
            .brand-logo {
                width: 105px;
                margin-bottom: 0.75rem !important;
            }

            .brand-title {
                font-size: clamp(2.2rem, 7vw, 4rem);
                margin-bottom: 1.25rem !important;
            }
        }
    </style>
</head>
<body class="bg-white">

    <main class="hero-wrapper d-flex flex-column justify-content-center align-items-center text-center px-3 px-sm-4 py-4 py-md-5">
        <!-- Transparent PNG Logo -->
        <img src="assets/img/logo.png"
             alt="Carel Black Logo"
             class="brand-logo img-fluid mb-3 mb-md-4">

        <!-- Main Title in Exile Font -->
        <h1 class="brand-title mb-4 mb-md-5">Carel Black</h1>

        <!-- Vertical Action Buttons -->
        <div class="btn-stack d-flex flex-column align-items-center gap-3">
            <a href="dashboard.jsp" class="btn action-btn btn-dashboard">
                Dashboard
            </a>

            <div class="store-btn-wrap" title="Coming soon">
                <button type="button"
                        class="btn action-btn btn-store-disabled"
                        disabled
                        aria-disabled="true">
                    Store
                </button>
            </div>
        </div>
    </main>

</body>
</html>
